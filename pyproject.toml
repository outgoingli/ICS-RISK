[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ics-risk"
version = "0.2.0"
description = "Evidence-backed graph-driven pre-execution ICS command assessment"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ics-risk = "ics_risk.cli:main"

[tool.setuptools.packages.find]
include = ["ics_risk*", "lvsp_eval*"]

[tool.setuptools.package-data]
ics_risk = ["web/*"]
